name: Update VPN Gate Servers

on:

  # Every hour
  schedule:
    - cron: "17 * * * *"

  # Manual update
  workflow_dispatch:

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update active VPN Gate servers
        run: |
          python scripts/update_servers.py

      - name: Check generated JSON
        run: |
          python -m json.tool servers.json > /dev/null
          echo "servers.json is valid"

      - name: Commit changes
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add servers.json

          if git diff --cached --quiet; then
            echo "No server changes"
          else
            git commit \
              -m "Update active VPN Gate servers"

            git push
          fi
